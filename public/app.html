<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Care Loop Demo</title>
  <meta name="description" content="Interactive demo of the Care Loop shared care profile.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="offline-banner" id="offline" hidden>You're offline. Nothing will be saved until you reconnect.</div>
  <header class="app-header">
    <div class="wrap">
      <a class="brand" href="/"><img class="brand-mark" src="/logo.svg" alt=""> Care Loop</a>
      <div class="who" id="who"></div>
    </div>
  </header>
  <div class="demo-banner">
    <div class="wrap">Demo only: data stays in this browser. Don't enter real patient information. Care Loop does not give medical advice.</div>
  </div>
  <main class="app" id="main">
    <div class="wrap" id="view"></div>
  </main>
  <div id="toast-region" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script src="/app.js"></script>
</body>
</html>
